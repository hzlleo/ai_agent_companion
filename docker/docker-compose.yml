# 工具沙盒代理编排 —— 独立部署面
#
# 后端**不进 compose**（经 backend/ pixi 运行——本文件只编排沙盒）：
# 后端经 http://127.0.0.1:8765 消费沙盒 /invoke（共享 httpx 池 + Bearer token，
# 见 backend harness/tools/sandbox.py 与 docs/backend/tools-sandbox.md）。
#
# 用法：
#   cd docker
#   export SANDBOX_TOKEN="<随机长 token>"            # 必填——缺失时 compose 拒绝起服务
#   export SANDBOX_HTTP_ALLOWLIST="example.com"     # 可选——空 = http_fetch 禁用（默认拒绝）
#   docker compose up -d tool-sandbox-agent
#   # 可选辅助模型服务（look_at 视觉 + embed 嵌入；需 NVIDIA Container Toolkit）：
#   docker compose up -d llama-server-vision llama-server-embed
#
# 辅助模型服务：
#   - llama-server-vision：Qwen3-VL-4B（Q4_K_M + F16 mmproj）——look_at 角色
#     端点（backend llm 注册表条目 base_url=http://127.0.0.1:8080/v1，
#     multimodal=true 绑定 look_at 角色）；
#   - llama-server-embed：Qwen3-Embedding-0.6B（f16，last pooling）——embed
#     角色端点（base_url=http://127.0.0.1:8081/v1）；
#   - 权重经 git-lfs 拉取的 models/ 子模组只读挂载（见 docs/models.md）；
#   - 显存预算（16GB）：视觉 ~4GB + 嵌入 ~0.8GB——余量充足；
#   - TTS（CosyVoice3）与 ASR（Qwen3-ASR）需各自服务包装面，见文件尾注释占位。
#
# GPU 服务加固窗口（部署验证面——当前有意未挂 directives，不盲加）：
#   - 现状：两 llama-server 服务仅具备卷 :ro + mem_limit；cap_drop /
#     no-new-privileges / user 覆盖**未**应用（与 tool-sandbox-agent 的
#     加固面差异是有意的待办，不是疏漏）；
#   - 约束：NVIDIA Container Toolkit 的 GPU 注入（`gpus: all` →
#     nvidia-container-runtime 设备挂载）与 `cap_drop: ALL` 等强收敛存在
#     兼容面风险——CUDA / NVML 需要的 capability 与设备 cgroup 规则须在
#     真实部署机上实测，盲加会以「服务起来但 GPU 不可用」的静默形态失败；
#   - 部署验证窗口的动作项：在部署机上按「cap_drop 最小集 + user 非
#     root + no-new-privileges:true + device_cgroup_rules（GPU 设备号）」
#     逐项加挂并验证 `nvidia-smi` / 推理可用后固化到本文件——加固验证
#     未完成前，该差异以本注释显式登记。
#
# 加固面（与 Dockerfile 内加固共同构成沙盒边界）：
#   - 端口仅回环暴露（127.0.0.1:8765:8765——后端本机消费，不对局域网开放）；
#   - cap_drop: ALL（弃全部 Linux capabilities）；
#   - no-new-privileges（进程树不可提权）；
#   - read_only + tmpfs /tmp（根文件系统只读；/tmp 内存盘——运行期零持久写盘）；
#   - 资源限额 mem 256m / cpus 0.5（工具风暴隔离面）；
#   - restart: unless-stopped（宿主机重启后自动恢复）。
#
# 网络语义（文档化决策）：本网络为 compose 项目内专用桥接网络（sandbox
# 服务独占——「internal」取「项目内专用」义）；**不设 `internal: true`**
# ——http_fetch 需要受控出站 egress（真正的出站管控面是
# SANDBOX_HTTP_ALLOWLIST 域名允许清单 + Dockerfile 抓取语义），
# internal:true 会同时阻断工具出站，使沙盒丧失职能。
#
# ─── 浏览器 sidecar（browser-sidecar——JS 渲染回退面） ─────────────────────
#
# 子资源允许清单权衡（文档化决策——sidecar 树 policy.py 路由拦截语义）：
#   - sidecar 在 context 创建期经 page.route("**/*") 拦截**全部**请求，
#     宿主不在 BROWSER_SIDECAR_ALLOWLIST 的子资源（第三方脚本 / 字体 /
#     图片）一律静默 abort——页面仍渲染允许清单内来源的内容；
#   - 代价：跨域 CDN 默认全断（多数现代站点会渲染残缺）。需要跨域资源
#     的站点由运维向允许清单追加后缀（如 cdn.jsdelivr.net）——默认面
#     宁可渲染残缺，不放行未知宿主；
#   - 允许清单同时管导航与重定向逐跳（navigate 先行校验 + 路由拦截
#     复检——belt and suspenders）；私网 IP 字面量无论清单一律拒绝。
#
# 加固面（与 Dockerfile 内加固共同构成 sidecar 边界；cap_drop 注意事项）：
#   - 端口仅回环暴露（127.0.0.1:8766:8766——后端本机消费）；
#   - shm_size 1g（chromium 渲染需要大 /dev/shm——容器默认 64MB 不足；
#     进程侧已叠加 --disable-dev-shm-usage 双保险）；
#   - mem_limit 2g / cpus 1.0（浏览器风暴隔离面——chromium 多进程树
#     的保守下限；部署机按实测收紧）；
#   - cap_drop: ALL 为 **best-effort 落位**（Playwright 注意事项）：
#     chromium 沙盒在容器内以 --no-sandbox 运行（非 root + 资源限额 +
#     网络允许清单收敛该面），若部署机上 cap_drop ALL 与 headless shell
#     的系统调用面冲突（seccomp / namespace 需求），首退为按需保留
#     SYS_ADMIN 等最小集——与 tool-sandbox 的全量弃权相比是文档化的
#     有意差异，部署验证后固化；
#   - no-new-privileges（进程树不可提权）；
#   - **不设 read_only**（profiles 卷需要写——持久登录态是职能面；
#     写面收敛到命名卷，不挂宿主路径）；
#   - restart: unless-stopped（宿主机重启后自动恢复）。

services:
  tool-sandbox-agent:
    build:
      context: ./tool-sandbox-agent
      dockerfile: Dockerfile
    image: tool-sandbox-agent:0.1.0
    container_name: tool-sandbox-agent
    environment:
      # 鉴权 token（必填——${VAR:?} 形态缺失即拒绝启动；值不落 compose 文件）。
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?SANDBOX_TOKEN 未设置——导出后再启动（见 docs/backend/tools-sandbox.md）}
      # http_fetch 域名允许清单（逗号分隔域名后缀；空 / 未设 = 工具禁用·默认拒绝）。
      SANDBOX_HTTP_ALLOWLIST: ${SANDBOX_HTTP_ALLOWLIST:-}
    ports:
      # 仅回环暴露：后端本机消费（127.0.0.1:8765 → 容器 8765）。
      - "127.0.0.1:8765:8765"
    # 资源限额（工具风暴隔离——内存 256 MiB / CPU 0.5 核）。
    mem_limit: 256m
    cpus: 0.5
    # 运行期加固（与 Dockerfile 的 tini / 非 root / HEALTHCHECK 互补）。
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    networks:
      - tool-sandbox

  # ─── 浏览器 sidecar：JS 渲染回退面（playwright chromium，独立隔离树） ──────
  # 后端经 http://127.0.0.1:8766 消费 /invoke（wire 契约 REST 同构沙盒；
  # 见 backend harness/tools/browser.py 与 docs/backend/tools-browser.md）。
  browser-sidecar:
    build:
      context: ./browser-sidecar
      dockerfile: Dockerfile
    image: browser-sidecar:0.1.0
    container_name: browser-sidecar
    environment:
      # 鉴权 token（必填——${VAR:?} 形态缺失即拒绝启动；值不落 compose 文件）。
      BROWSER_SIDECAR_TOKEN: ${BROWSER_SIDECAR_TOKEN:?BROWSER_SIDECAR_TOKEN 未设置——导出后再启动（见 docs/backend/tools-browser.md）}
      # 导航 / 子资源域名允许清单（逗号分隔域名后缀；空 / 未设 = navigate
      # 拒绝一切·默认拒绝——子资源权衡见文件头「浏览器 sidecar」注释块）。
      BROWSER_SIDECAR_ALLOWLIST: ${BROWSER_SIDECAR_ALLOWLIST:-}
      # 导航超时秒数（1-120；缺省 20）。
      BROWSER_SIDECAR_NAV_TIMEOUT_SECONDS: ${BROWSER_SIDECAR_NAV_TIMEOUT_SECONDS:-20}
      # 生效 profile 名（context-per-profile 注册表键——持久登录态卷内目录）。
      BROWSER_SIDECAR_PROFILE: ${BROWSER_SIDECAR_PROFILE:-default}
    ports:
      # 仅回环暴露：后端本机消费（127.0.0.1:8766 → 容器 8766）。
      - "127.0.0.1:8766:8766"
    volumes:
      # 持久登录态（cookies / localStorage 跨重启留存——写面收敛到命名卷）。
      - browser-sidecar-profiles:/app/profiles
    # chromium 渲染需要大 /dev/shm（容器默认 64MB 不足；进程侧叠加
    # --disable-dev-shm-usage 双保险）。
    shm_size: 1g
    # 资源限额（浏览器风暴隔离——chromium 多进程树的保守下限）。
    mem_limit: 2g
    cpus: 1.0
    # 运行期加固（cap_drop best-effort 注意事项见文件头注释块）。
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - tool-sandbox

  # ─── 辅助模型服务：look_at 视觉理解（Qwen3-VL-4B GGUF + mmproj） ────────────
  # OpenAI 兼含图端点 /v1/chat/completions；后端经 llm 注册表条目消费。
  llama-server-vision:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server-vision
    volumes:
      - ../models/Qwen3-VL-4B-Instruct-GGUF:/models:ro
    command: >
      -m /models/Qwen3VL-4B-Instruct-Q4_K_M.gguf
      --mmproj /models/mmproj-Qwen3VL-4B-Instruct-F16.gguf
      -c 8192 -ngl 99 --host 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:8080:8080"
    gpus: all
    mem_limit: 8g
    restart: unless-stopped
    networks:
      - tool-sandbox

  # ─── 辅助模型服务：记忆检索嵌入（Qwen3-Embedding-0.6B，last pooling） ───────
  # /v1/embeddings 端点；后端 embed 角色条目消费。
  llama-server-embed:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server-embed
    volumes:
      - ../models/Qwen3-Embedding-0.6B-GGUF:/models:ro
    command: >
      -m /models/Qwen3-Embedding-0.6B-f16.gguf
      --embedding --pooling last
      -c 8192 -ngl 99 --host 0.0.0.0 --port 8081
    ports:
      - "127.0.0.1:8081:8081"
    gpus: all
    mem_limit: 2g
    restart: unless-stopped
    networks:
      - tool-sandbox

  # ─── GUI 微信实验轨：Xorg + uinput 栈（PoC 门阶段，默认不启动） ───────────
  # 仅沙盒运行时：过门后才接后端通道（当前无 wire 契约——不参与
  # sandbox-drift 门禁）。启动：
  #   export WECHAT_GUI_VNC_PASSWORD_FILE=/path/to/vnc.pass   # 真实密码文件
  #   cd docker && docker compose --profile wechat-gui up -d wechat-gui
  #
  # 安全边界（生产运行——与非 privileged 的设备 / 能力最小集）：
  #   - **不使用 privileged**：只映射 /dev/uinput（可选 /dev/dri）；
  #   - cap_drop ALL + 仅补 MKNOD（容器内 /dev/input 事件节点无 udev，
  #     由 uinputd 按 sysfs dev 号 mknod）与 CHOWN（把节点交给运行用户）；
  #   - 端口仅回环：5900（x11vnc）/ 6080（noVNC）；VNC 密码经文件 secret；
  #   - 入口以 root 启动、Xorg / x11vnc / websockify 降权到 wechat 用户；
  #   - no-new-privileges + 资源限额（Xorg / VNC 风暴隔离）。
  # PoC 宿主运行器（poc/run_stack_poc.sh）为兼容性使用 --privileged；生产
  # 以本服务形态为准（见 docker/wechat-gui/README.md「安全边界」）。
  wechat-gui:
    profiles: ["wechat-gui"]
    build:
      context: ./wechat-gui
      dockerfile: Dockerfile
    image: wechat-gui:0.1.0
    container_name: wechat-gui
    environment:
      # x11vnc 密码文件（compose secret 挂载点；文件内容为单行密码）。
      WECHAT_GUI_VNC_PASSWDFILE: /run/secrets/wechat_gui_vnc_password
      WECHAT_GUI_DISPLAY: ":99"
    secrets:
      - wechat_gui_vnc_password
    devices:
      # uinput 主设备（生产不 privileged 时的唯一必需设备映射）。
      - /dev/uinput:/dev/uinput
      # 可选：宿主 GPU 渲染（dummy 驱动不需要；接入微信客户端后可按需启用）。
      # - /dev/dri:/dev/dri
    device_cgroup_rules:
      # uinput 动态创建的 input 事件节点属主设备号 13；不 privileged 时
      # 必须显式放行该字符设备类别（映射 /dev/uinput 只放行 10:223）。
      - "c 13:* rwm"
    ports:
      # 仅回环暴露：宿主浏览器访问 noVNC；VNC 直连亦仅本机。
      - "127.0.0.1:5900:5900"
      - "127.0.0.1:6080:6080"
    # 容器内 /dev/uinput 由 root 打开；事件节点 mknod/chown 需要最小能力集。
    cap_drop:
      - ALL
    cap_add:
      # 容器内无 udev：mknod 事件节点 + chown 给运行用户 + runuser 降权
      # + 清理时向降权子进程发信号。
      - MKNOD
      - CHOWN
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    # Xorg + VNC 的资源上限（按部署机实测收紧）。
    shm_size: 256m
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    networks:
      - tool-sandbox

  # ─── 待接入（部署面占位，未启用） ────────────────────────────────────────────
  # TTS（CosyVoice3）：models/Fun-CosyVoice3-0.5B-2512 权重 + 官方运行时薄包装，
  #   暴露 POST /tts {"text","speaker","speed"} → audio/wav（契约见
  #   backend harness/voice/tts_client.py docstring 与 docs/backend/voice.md）；
  #   后端 Settings.voice.tts.base_url 指向该服务。
  # ASR（Qwen3-ASR-0.6B）：models/Qwen3-ASR-0.6B 权重 + vLLM 工具包服务
  #   （本地服务钉 vllm==0.14.0——与远端主 LLM 的 0.32+ 互不影响），
  #   OpenAI 兼容 /v1/audio/transcriptions；后端 Settings.voice.asr.base_url。

networks:
  # compose 项目内专用桥接网络（沙盒 / sidecar 服务共用；见文件头「网络语义」注释）。
  tool-sandbox:
    driver: bridge

volumes:
  # 浏览器 sidecar 持久登录态（profiles/<name>——cookies / localStorage
  # 跨重启留存；写面收敛到命名卷，不挂宿主路径）。
  browser-sidecar-profiles:

secrets:
  # x11vnc 密码文件（内容为单行密码）。缺省指向仓库内开发占位文件；
  # 生产必须经 WECHAT_GUI_VNC_PASSWORD_FILE 指向真实密码文件（不入库）。
  wechat_gui_vnc_password:
    file: ${WECHAT_GUI_VNC_PASSWORD_FILE:-./wechat-gui/vnc.pass.default}
