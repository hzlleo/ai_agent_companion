name: CI

# CI: 全量验证 —— backend 与 frontend 两个 job 并行，各自单次 pixi 安装后串行复用。
#
# 结构说明：
#   backend job —— 测试 / 覆盖率门 / 工程门禁 / lint / typecheck 串行执行，
#   共享一次环境安装（安装耗时远大于各检查本身的耗时，拆分并行
#   无收益且成倍放大下载挂起面）。
#   frontend job —— 前端独立 pixi 工程（Node 22 + npm）：lint / 测试 /
#   覆盖率门（perFile ≥80%）/ 构建，经 npm 缓存加速。
#
# Triggers:
#   - Pull request targeting main or develop
#   - Push to main / develop
#   - workflow_dispatch 手动触发
#
# 所有 pixi 命令均通过 `cd <子项目> &&` 在子项目目录执行（根项目无 Python/Node）。

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + gates + lint + typecheck)
    runs-on: ubuntu-latest
    # SeekDB 真引擎强制套件的测试服务容器（MySQL 线协议 2881；套件经
    # job 级 SEEKDB_TEST_* 显式 env 指向 127.0.0.1:2881 的端口映射）。
    # 容器随 job 启动，但就绪需 ~60-90s（初始化）——套件步骤前置专用
    # 就绪探针（最长 180s；service 容器无 healthcheck 语义，等待是
    # 必要的——否则首连即败）。
    services:
      seekdb:
        image: oceanbase/seekdb:1.4.0-100000172026082615
        ports:
          - 2881:2881
    env:
      SEEKDB_TEST_URL: 127.0.0.1:2881
      SEEKDB_TEST_USER: root
      SEEKDB_TEST_PASSWORD: ''
      SEEKDB_TEST_DATABASE: aac_ci_verify
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi (single locked install, lock-keyed cache; reused by all steps below)
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.82.0
          manifest-path: backend/pixi.toml
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Tests (unit + integration)
        run: cd backend && pixi run tests-all

      # SeekDB 真引擎强制套件（与 tests-all 分离：tests-all 须在无容器的
      # 本地快速回路可跑——套件经 pyproject norecursedirs 不入 src/tests/
      # 扫集，仅本步骤显式定向运行；env 来自 job 级 SEEKDB_TEST_* + service
      # 容器端口映射，不经 pixi tests-seekdb 任务）。
      - name: Wait for SeekDB service readiness (up to 180s)
        run: |
          cat > /tmp/wait_seekdb.py <<'PY'
          import asyncio
          import os
          import sys

          import aiomysql


          async def main() -> int:
              url = os.environ.get("SEEKDB_TEST_URL", "")
              host, _, port_text = url.partition(":")
              port = int(port_text) if port_text else 2881
              for attempt in range(90):
                  try:
                      conn = await aiomysql.connect(
                          host=host,
                          port=port,
                          user=os.environ.get("SEEKDB_TEST_USER", "root"),
                          password=os.environ.get("SEEKDB_TEST_PASSWORD", ""),
                      )
                      conn.close()
                      print(f"[wait-seekdb] ready after {attempt + 1} attempt(s)")
                      return 0
                  except Exception as exc:
                      print(f"[wait-seekdb] attempt {attempt + 1}: {type(exc).__name__}: {exc}")
                      await asyncio.sleep(2)
              print("[wait-seekdb] SeekDB service NOT ready after 180s", file=sys.stderr)
              return 1


          sys.exit(asyncio.run(main()))
          PY
          cd backend && pixi run python /tmp/wait_seekdb.py

      - name: Tests (SeekDB real-engine suite)
        run: cd backend && pixi run pytest src/tests/integration_seekdb -v --asyncio-mode=auto

      - name: Coverage gates (per-module >= 80%, enforce)
        run: cd backend && pixi run coverage-gates

      - name: Engineering gates (comments / sync-test ratchet / noqa freeze / sandbox drift)
        run: pixi run gates

      - name: Lint (ruff)
        run: cd backend && pixi run lint

      - name: Typecheck (mypy)
        run: cd backend && pixi run typecheck

  # ─── Frontend: 管理台（独立 pixi 工程，Node 22 + npm） ──────────────────────
  frontend:
    name: Frontend (lint + tests + coverage + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi (single install of the node env, lock-keyed cache)
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.82.0
          manifest-path: frontend/pixi.toml
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: frontend-npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: frontend-npm-${{ runner.os }}-

      - name: Install npm dependencies (pixi run install)
        run: cd frontend && pixi run install

      - name: Lint (tsc --noEmit + eslint)
        run: cd frontend && pixi run lint

      - name: Tests (vitest, msw-mocked)
        run: cd frontend && pixi run test

      - name: Coverage gates (perFile >= 80%, enforce)
        run: cd frontend && pixi run coverage

      - name: Build (tsc + vite build)
        run: cd frontend && pixi run build

      # 产物体积门禁（初始加载 JS ≤1MB 且至少 3 个路由级动态 chunk）。
      # 复用上一步 dist：bundle-check 不重复构建，只解析 manifest。
      - name: Bundle budget gate (initial JS <= 1MB, >= 3 lazy chunks)
        run: cd frontend && pixi run bundle-check

  # ─── Tool sandbox: docker 隔离树（独立 pixi 工程） ──────────────────────────
  tool-sandbox:
    name: Tool sandbox (tests + lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi (single install of the env, lock-keyed cache)
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.82.0
          manifest-path: docker/tool-sandbox-agent/pixi.toml
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Tests (pytest, coverage >= 80% enforced)
        run: cd docker/tool-sandbox-agent && pixi run tests-unit

      - name: Lint (ruff)
        run: cd docker/tool-sandbox-agent && pixi run lint

      - name: Typecheck (mypy)
        run: cd docker/tool-sandbox-agent && pixi run typecheck

      # 镜像构建验证（Dockerfile 变更 CI 即红——pip install 打包面 / tini /
      # HEALTHCHECK / 非 root 等加固步骤不经测试任务覆盖，构建是唯一验证面）。
      - name: Docker build (tool-sandbox-agent image)
        run: docker build -t tool-sandbox-agent:ci docker/tool-sandbox-agent/

  # ─── Browser sidecar: docker 隔离树（独立 pixi 工程） ───────────────────────
  # 与 tool-sandbox job 同形（pixi 安装 + 测试 + lint + typecheck），但
  # **不构建镜像**：playwright 基底镜像（mcr.microsoft.com/playwright/
  # python）约 2GB——CI 拉取 / 存储与时长成本远超价值，且镜像正确性的
  # 关键面（playwright 驱动 ↔ 基底浏览器构建的版本对齐、真实浏览器行为）
  # 本就不经构建验证，须在部署机实测（见 docker/browser-sidecar/README.md
  # 「部署验证」）。树内逻辑面（策略链 / 执行器 / wire 契约）由本 job 的
  # hermetic 测试全覆盖。
  browser-sidecar:
    name: Browser sidecar (tests + lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi (single install of the env, lock-keyed cache)
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.82.0
          manifest-path: docker/browser-sidecar/pixi.toml
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Tests (pytest, coverage >= 80% enforced, hermetic fake faces)
        run: cd docker/browser-sidecar && pixi run tests-unit

      - name: Lint (ruff)
        run: cd docker/browser-sidecar && pixi run lint

      - name: Typecheck (mypy)
        run: cd docker/browser-sidecar && pixi run typecheck

  # ─── GUI 微信实验轨沙盒: docker 隔离树（独立 pixi 工程） ────────────────────
  # 与其余沙盒 job 同形（pixi 安装 + 测试 + lint + typecheck），**不构建镜像**：
  # 镜像的 Xorg / dummy / evdev / uinput 行为需要真实内核设备（/dev/uinput）
  # 与特权运行，CI runner 面不具备；镜像与栈的实测在宿主 PoC 运行器执行
  # （docker/wechat-gui/poc/run_stack_poc.sh，证据落 docs/evidence/poc/）。
  # 树内逻辑面（ioctl 编码 / sysfs 发现 / 控制面协议 / 门脚本编排 / 图像
  # 校验）由本 job 的 hermetic 测试全覆盖。
  wechat-gui:
    name: WeChat GUI sandbox (tests + lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi (single install of the env, lock-keyed cache)
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.82.0
          manifest-path: docker/wechat-gui/pixi.toml
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Tests (pytest, coverage >= 80% enforced, hermetic)
        run: cd docker/wechat-gui && pixi run tests-unit

      - name: Lint (ruff)
        run: cd docker/wechat-gui && pixi run lint

      - name: Typecheck (mypy)
        run: cd docker/wechat-gui && pixi run typecheck
