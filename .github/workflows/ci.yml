name: CI

# CI: Test infrastructure — backend tests + gates + lint + typecheck.
#
# Triggers:
#   - Pull request targeting master or develop
#   - Push to master / develop
#
# Jobs:
#   backend-test — cd backend && pixi install + tests-all + coverage gates + 工程门禁集
#   lint         — cd backend && pixi run lint（ruff）
#   typecheck    — cd backend && pixi run typecheck（mypy）
#
# frontend-test / docker 树测试 job 在对应子项目落地后追加（见 docs/README.md 路线图）。
# 所有 pixi 命令均通过 `cd backend &&` 在子项目目录执行（根项目无 Python/Node）。

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend: pytest + per-module coverage ≥80% + 工程门禁 ────────────────
  backend-test:
    name: Backend tests + coverage + gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Install backend environment (pixi install)
        run: cd backend && pixi install

      - name: Run all backend tests (unit + integration, pixi run tests-all)
        run: cd backend && pixi run tests-all

      - name: Coverage gates — per-module ≥80% enforce (pixi run coverage-gates)
        run: cd backend && pixi run coverage-gates

      - name: Engineering gates — comments / sync-test ratchet / noqa freeze
        run: pixi run gates

  # ─── Lint: backend ruff ────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Install backend environment (pixi install — includes ruff)
        run: cd backend && pixi install

      - name: Backend lint (ruff check src/)
        run: cd backend && pixi run lint

  # ─── Typecheck: backend mypy ───────────────────────────────────────────────
  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Install backend environment (pixi install — includes mypy)
        run: cd backend && pixi install

      - name: Backend typecheck (mypy src/)
        run: cd backend && pixi run typecheck
