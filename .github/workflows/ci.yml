name: CI

# CI: 全量验证 —— backend 与 frontend 两个 job 并行，各自单次 pixi 安装后串行复用。
#
# 结构说明：
#   backend job —— 测试 / 覆盖率门 / 工程门禁 / lint / typecheck 串行执行，
#   共享一次环境安装（安装耗时远大于各检查本身的耗时，拆分并行
#   无收益且成倍放大下载挂起面）。
#   frontend job —— 前端独立 pixi 工程（Node 22 + npm）：lint / 测试 /
#   覆盖率门（perFile ≥80%）/ 构建，经 npm 缓存加速。
#
# Triggers:
#   - Pull request targeting main or develop
#   - Push to main / develop
#   - workflow_dispatch 手动触发
#
# 所有 pixi 命令均通过 `cd <子项目> &&` 在子项目目录执行（根项目无 Python/Node）。

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + gates + lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi (single locked install, lock-keyed cache; reused by all steps below)
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.82.0
          manifest-path: backend/pixi.toml
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Tests (unit + integration)
        run: cd backend && pixi run tests-all

      - name: Coverage gates (per-module >= 80%, enforce)
        run: cd backend && pixi run coverage-gates

      - name: Engineering gates (comments / sync-test ratchet / noqa freeze / sandbox drift)
        run: pixi run gates

      - name: Lint (ruff)
        run: cd backend && pixi run lint

      - name: Typecheck (mypy)
        run: cd backend && pixi run typecheck

  # ─── Frontend: 管理台（独立 pixi 工程，Node 22 + npm） ──────────────────────
  frontend:
    name: Frontend (lint + tests + coverage + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi (single install of the node env, lock-keyed cache)
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.82.0
          manifest-path: frontend/pixi.toml
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: frontend-npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: frontend-npm-${{ runner.os }}-

      - name: Install npm dependencies (pixi run install)
        run: cd frontend && pixi run install

      - name: Lint (tsc --noEmit + eslint)
        run: cd frontend && pixi run lint

      - name: Tests (vitest, msw-mocked)
        run: cd frontend && pixi run test

      - name: Coverage gates (perFile >= 80%, enforce)
        run: cd frontend && pixi run coverage

      - name: Build (tsc + vite build)
        run: cd frontend && pixi run build

  # ─── Tool sandbox: docker 隔离树（独立 pixi 工程） ──────────────────────────
  tool-sandbox:
    name: Tool sandbox (tests + lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi (single install of the env, lock-keyed cache)
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.82.0
          manifest-path: docker/tool-sandbox-agent/pixi.toml
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Tests (pytest, coverage >= 80% enforced)
        run: cd docker/tool-sandbox-agent && pixi run tests-unit

      - name: Lint (ruff)
        run: cd docker/tool-sandbox-agent && pixi run lint

      - name: Typecheck (mypy)
        run: cd docker/tool-sandbox-agent && pixi run typecheck

      # 镜像构建验证（Dockerfile 变更 CI 即红——pip install 打包面 / tini /
      # HEALTHCHECK / 非 root 等加固步骤不经测试任务覆盖，构建是唯一验证面）。
      - name: Docker build (tool-sandbox-agent image)
        run: docker build -t tool-sandbox-agent:ci docker/tool-sandbox-agent/
