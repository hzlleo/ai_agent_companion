[[probes]]
name = "flow-gate-removal"
symbol = "packages.harness.chat.flow_gate:evaluate_flow_gate"
tests = [
    "tests/unit/test_flow_gate.py::test_disabled_gate_always_replies",
    "tests/unit/test_flow_gate.py::test_sleep_window_defers_until_wake",
]

[[probes]]
name = "persona-rotation-removal"
symbol = "packages.harness.chat.persona_rotation:select_group_responders"
tests = [
    "tests/unit/test_persona_rotation.py::test_rotation_prefers_previous_non_responder",
]

[[probes]]
name = "compliance-detector-removal"
symbol = "packages.harness.chat.compliance_guard:detect_assistant_violation"
tests = [
    "tests/unit/test_compliance_guard.py::test_detect_blank_text_not_violated",
]

[[probes]]
name = "sticker-bridge-decode-removal"
symbol = "packages.harness.multimodal.sticker_bridge:decode_inbound_stickers"
tests = [
    "tests/unit/test_sticker_bridge.py::test_decode_inbound_stickers_keeps_inline_base64_and_caption",
    "tests/unit/test_sticker_bridge.py::test_decode_inbound_stickers_skips_invalid_and_reference_sources",
]

[[probes]]
name = "auth-policy-removal"
symbol = "packages.harness.config.auth_policy:ensure_auth_policy"
tests = [
    "tests/unit/test_auth_policy.py::test_prod_with_empty_admin_token_rejects_startup",
    "tests/unit/test_auth_policy.py::test_prod_with_qq_enabled_and_empty_webhook_token_rejects",
]

[[probes]]
name = "outbound-guard-removal"
symbol = "packages.harness.channels.outbound_guard:validate_http_url"
tests = [
    "tests/unit/test_outbound_guard.py::test_missing_host_rejected",
]
