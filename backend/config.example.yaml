# ai_agent_companion 功能配置模板
#
# 用法：复制为 config.yaml 并按需调整；或运行 `pixi run setup` 交互式生成。
# 分层加载链（优先级从低到高）：代码默认值 < .env < 进程环境变量；
# 本文件承载结构化配置（llm 模型注册表 / 角色绑定 / 多模态回退链 /
# search 搜索 provider 注册表），与 env 面不重叠。
#
# 所有配置键必须 lowercase_with_underscores。
# 敏感信息（API Key、密码）不写在此文件，统一走 .env（条目经
# api_key_env 指向环境变量名）。
#
# 本文件由 `pixi run gen-examples` 从 LlmModelEntry / LlmConfig /
# RoutePolicyModel / MultimodalFallbackConfig / SearchConfig /
# SearchProviderEntry / WebSearchSettings 自动生成。
# 不要手动编辑——请修改配置类的 Field(description=...) 后重新生成。

# ===========================================================================
# llm — LLM 模型配置列表（多 provider OpenAI 兼容注册表）
# 每个 model 定义一个可调用的端点；api_key_env 指向 .env 中的变量名
# （本地免鉴权端点可留空）；roles 声明该条目承接的角色。
# LlmModelEntry 字段 schema:
#   name (str): 条目唯一标识（角色绑定引用）
#   provider (str): provider 类型
#   base_url (str): API 基础 URL（含 /v1）
#   api_key_env (str): API Key 环境变量名（空=免鉴权）
#   model (str): 模型名（provider model 参数）
#   roles (list[ModelRole]): 条目承接的角色集
#   concurrency (int | None): 条目并发上限（None=全局默认）
#   multimodal (bool): 是否支持多模态输入
#   default_params (ChatRequestParams | None): 条目级缺省采样参数（None=端点默认；只补齐调用方未设置的字段）
#   角色值域: chat, duty, dream, look_at, embed
# ===========================================================================
llm:
  models:
    - name: "main-chat"
      provider: "openai_compatible"
      base_url: "https://api.example.com/v1"
      api_key_env: "MAIN_CHAT_API_KEY"
      model: "glm-5.3"
      roles: ["chat", "duty"]
      concurrency: 4
    - name: "dream-writer"
      provider: "openai_compatible"
      base_url: "https://api.example.com/v1"
      api_key_env: "DREAM_WRITER_API_KEY"
      model: "glm-5.3-mini"
      roles: ["dream"]
      concurrency: 2
    - name: "local-vision"
      provider: "openai_compatible"
      base_url: "http://127.0.0.1:8001/v1"
      api_key_env: ""  # 本地免鉴权端点
      model: "qwen2.5-vl-7b"
      roles: ["look_at"]
      concurrency: 2
      multimodal: true
    - name: "local-embed"
      provider: "openai_compatible"
      base_url: "http://127.0.0.1:8002/v1"
      api_key_env: ""  # 本地免鉴权端点
      model: "bge-m3"
      roles: ["embed"]
      concurrency: 4
    - name: "chat-night"
      provider: "openai_compatible"
      base_url: "https://api.example.com/v1"
      api_key_env: "CHAT_NIGHT_API_KEY"
      model: "glm-5.3-night"
      roles: []
      concurrency: 2

  # 显式角色绑定（角色 → 条目名；优先于条目自身 roles 声明）。
  # 注册表五角色由条目 roles 声明承接；此处仅绑定条件路由策略的
  # 目标角色（chat_night → 夜间条目）。
  # 示例：
  # role_bindings:
  #   chat: "main-chat"
  role_bindings:
    chat_night: "chat-night"

  # ===========================================================================
  # route_policies — 条件路由策略（原角色在条件命中时改由目标角色条目
  # 承接；默认空列表 = 零行为变更）。条件维度：亲密度区间 / 关系摘要
  # 可用性 / 时段（IANA 时区，end<=start 视为跨午夜）/ 对话类型（用途名）。
  # 示例：夜间 chat → chat_night（Asia/Shanghai）。chat_night 须在
  # models 中有条目并经 role_bindings 绑定（示例已绑定到 chat-night）。
  # RoutePolicyModel 字段 schema:
#   name (str): 策略名（日志与错误 details 引用）
#   source_role (str): 原角色名
#   target_role (str): 目标角色名（不得等于原角色）
#   priority (int): 优先级（降序；同优先级按声明序）
#   condition (RouteConditionModel): 命中条件（AND 组合）
#   fallback_to_source (bool): 目标未绑定时回落原角色（False=抛 MODEL_NOT_FOUND）
  # RouteConditionModel 字段 schema:
#   min_intimacy_level (int | None): 最低亲密等级（None=不约束下沿）
#   max_intimacy_level (int | None): 最高亲密等级（None=不约束上沿）
#   time_window (TimeWindowModel | None): 时段窗口（None=不约束时段）
#   requires_summary (bool | None): 摘要可用性（True=仅可用/False=仅不可用/None=不约束）
#   purposes (tuple[str, ...]): 对话类型白名单（本轮调用用途名；空=不约束）
  # TimeWindowModel 字段 schema:
#   start_hour (int): 窗口起始小时（0-23，含）
#   end_hour (int): 窗口结束小时（0-23，不含；<= 起始小时视为跨午夜）
#   timezone (str): IANA 时区名（默认 UTC）
  route_policies:
    - name: "night-chat"
      source_role: "chat"
      target_role: "chat_night"
      priority: 100
      condition:
        time_window:
          start_hour: 22
          end_hour: 6
          timezone: "Asia/Shanghai"
      fallback_to_source: true

  # ===========================================================================
  # multimodal_fallback — look_at 角色非多模态时的回退链
  # （本地视觉端点 → 远程多模态端点，本地优先；两级均可选）
  # MultimodalFallbackConfig 字段 schema:
#   local (LlmModelEntry | None): 本地视觉端点（回退链第一级，低延迟）
#   remote (LlmModelEntry | None): 远程多模态端点（回退链第二级，兜底）
  # ===========================================================================
  multimodal_fallback:
    local:
      name: "local-vision-fallback"
      base_url: "http://127.0.0.1:8001/v1"
      api_key_env: ""  # 本地免鉴权端点
      model: "qwen2.5-vl-7b"
      multimodal: true
    remote:
      name: "remote-vision-fallback"
      base_url: "https://api.example.com/v1"
      api_key_env: "REMOTE_VISION_API_KEY"
      model: "glm-4.6v"
      multimodal: true

# ===========================================================================
# search — 搜索 provider 注册表 + web_search 运营子块（默认关闭）
# providers 列表序 = failover 尝试序（bocha 主 / zhipu 兜底）；
# 条目只携带 api_key_env 变量名，密钥本值永不落 yaml。
# SearchConfig 字段 schema:
#   providers (list[SearchProviderEntry]): provider 条目列表（列表序=failover 尝试序）
#   web_search (WebSearchSettings): 运营子块（开关/预算/冷却）
# SearchProviderEntry 字段 schema:
#   name (str): 条目唯一标识
#   kind (Literal[bocha, zhipu]): provider 类型（bocha/zhipu）
#   base_url (str): API 基础 URL（空=按 kind 缺省）
#   api_key_env (str): API Key 环境变量名（空=按 kind 缺省；密钥本值永不落 yaml）
#   model (str): provider 专属模型/引擎标识（空=按 kind 缺省）
#   max_results (int): 单次搜索返回条数上限（1-20）
#   timeout_seconds (float): 单次请求超时（秒）
# WebSearchSettings 字段 schema:
#   enabled (bool): 是否启用联网搜索能力
#   tool_enabled (bool): 是否注册 web_search 工具（需 enabled 同时为真）
#   daily_budget_per_persona (int): 单人格每日搜索调用数预算
#   daily_budget_global (int): 全局每日搜索调用数预算
#   cooldown_seconds (int): provider 失败降级冷却秒数
# ===========================================================================
search:
  providers:
    - name: "bocha-main"
      kind: "bocha"
      api_key_env: "SEARCH_BOCHA_API_KEY"
      model: "web-search"
      max_results: 8
      timeout_seconds: 15.0
    - name: "zhipu-fallback"
      kind: "zhipu"
      api_key_env: "SEARCH_ZHIPU_API_KEY"
      model: "search_std"
      max_results: 8
      timeout_seconds: 15.0
  web_search:
    enabled: false
    tool_enabled: false
    daily_budget_per_persona: 50
    daily_budget_global: 200
    cooldown_seconds: 60
