# ai_agent_companion — 后端独立 Pixi 项目
#
# 职责：管理后端 Python 3.12 运行时 + dev 工具 + 全部后端 tasks。
# 本文件与 pyproject.toml 同目录（backend/），editable = { path = "." } 解析到本目录。
# 依赖声明（运行时 + dev extras）在 pyproject.toml，pixi 通过 editable install 读取；
# pixi 仅管理 Python 解释器 + 系统工具（约束：Python 包依赖单一数据源 = pyproject）。
#
# 环境：
#   default = [dev]   本地开发（runtime + dev 工具：pytest/ruff/mypy）
#   prod    = []      生产/Docker（仅 runtime，无 dev 工具）
#
# 用法：
#   cd backend && pixi install                    # 安装 default 环境
#   cd backend && pixi install --environment prod # 安装 prod 环境（Docker 用）
#   cd backend && pixi run tests-unit             # 单元测试
#   cd backend && pixi run tests-all              # 后端全量测试
#   cd backend && pixi run lint                   # ruff 静态检查
#   cd backend && pixi run typecheck              # mypy 类型检查
#   cd backend && pixi run coverage-gates         # 按模块覆盖率门禁（≥80% enforce）
#
# 任务名契约：tests-unit / tests-integration / tests-all / lint / typecheck /
# coverage-gates / comment-gates / sync-test-ratchet / noqa-freeze 为跨树契约
# （根 pixi.toml 与 .github/workflows/ci.yml 按名委托）——严禁更名。

[workspace]
name = "ai-agent-companion-backend"
version = "0.1.0"
description = "自建「大肥鱼」式 AI 陪伴智能体 - 后端"
channels = [
    "https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge/",
    "conda-forge",
]
platforms = ["linux-64"]

# ─── 运行时依赖（prod + default 共享；仅解释器 + pip 系统工具）───
[dependencies]
python = { version = ">=3.12,<3.13", channel = "https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge/" }
pip = { version = ">=26.0,<27", channel = "https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge/" }

# ─── PyPI 镜像配置（所有环境共享）───
[pypi-options]
index-url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
extra-index-urls = [
    "https://mirrors.aliyun.com/pypi/simple",
    "https://mirrors.ustc.edu.cn/pypi/simple",
    "https://pypi.org/simple",
]

# ─── 本地 editable 包（运行时依赖由 pyproject.toml [project.dependencies] 声明）───
[pypi-dependencies]
ai-agent-companion-backend = { path = ".", editable = true }

# ─── 激活环境变量（pixi 项目根 = backend/，所以 PYTHONPATH = $PIXI_PROJECT_ROOT/src）───
[activation.env]
PYTHONIOENCODING = "utf-8"
PYTHONNOUSERSITE = "1"
UV_DEFAULT_INDEX = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
UV_EXTRA_INDEX = "https://mirrors.aliyun.com/pypi/simple https://mirrors.ustc.edu.cn/pypi/simple https://pypi.org/simple"
# packages 是 PEP 420 namespace package（backend/src/packages/ 无 __init__.py）。
# editable install 的发现器覆盖 backend/src/，此处显式加入 backend/src
# 使 pixi run python 能导入 packages.harness.* 全部域包（与 pyproject pythonpath 一致）。
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"

# ═══════════════════════════════════════════════════════════════════════════════
# Tasks — 后端全部 tasks（runtime + dev 共享；test-* 工具由 dev feature 提供）
# 注：pixi 项目根 = backend/，所以 src/ 是相对 backend/ 的路径；
# 引用仓库根资源时用 ../ 前缀（../scripts/）。
# ═══════════════════════════════════════════════════════════════════════════════
[tasks]
# 单元测试：src/tests/unit/ 下的纯单元测试。
# 不设 --cov-fail-under——聚合口径对逐模块 ≥80% 门禁数学上不可靠（失败
# 会毒杀 depends-on 测试链）；保留 --cov 报告作为观测信号，
# 逐模块门禁由 coverage-gates（enforce 模式）承担。
tests-unit = { cmd = "pytest src/tests/unit/ -v --asyncio-mode=auto --cov=src/packages/harness --cov-report=term-missing", description = "运行单元测试（src/tests/unit/；asyncio auto + 覆盖率报告）" }
# 集成测试：src/tests/integration/ 下的组件协作 / 全链路测试。
tests-integration = { cmd = "pytest src/tests/integration/ -v --asyncio-mode=auto --cov=src/packages/harness --cov-report=term-missing", description = "运行集成测试（src/tests/integration/；前置先跑单元测试）", depends-on = ["tests-unit"] }
# 完整测试（tests-all）：单 session 运行全部 backend 树测试（单元 + 集成 +
# harness 内嵌——后续 chunk 落地后自动并入收集）。
# ⚠️ 严禁用于定向运行：追加的 CLI 参数会拼在硬编码路径【之后】——仍是全量
# 收集。定向运行一律用：pixi run pytest <文件...> -q --asyncio-mode=auto。
# 仅旗标类参数（-x / -q / --no-cov）可安全追加。
# 路径必须用 $PIXI_PROJECT_ROOT 绝对形态：src/conftest.py 在收集期即 chdir
# 至 scratch 目录（CWD 隔离），相对路径在该时点之后不可靠。
# P0 无 xdist（dev 依赖清单未含 pytest-xdist——锁定决策，后续按需评审追加）。
tests-all = { cmd = "pytest $PIXI_PROJECT_ROOT/src/tests/ $PIXI_PROJECT_ROOT/src/packages/harness/ --asyncio-mode=auto", description = "运行全部后端测试（单元 + 集成 + harness 内嵌；单进程；严禁定向使用——定向用 pixi run pytest <文件> -q --asyncio-mode=auto）" }
# 静态检查：ruff over src/（任务名契约——根 pixi lint-all / CI lint job 委托此处）
lint = { cmd = "ruff check src/", description = "ruff 静态检查（仅 backend/src）" }
# 格式化
format = { cmd = "ruff format src/", description = "ruff 格式化" }
# 类型检查：mypy over src/（任务名契约——根 pixi typecheck / CI typecheck job 委托此处）
typecheck = { cmd = "mypy src/", description = "mypy 静态类型检查（严格模式）" }
# 按模块覆盖率门禁（每模块 ≥80%，禁止聚合偷懒）：全量单 session 测试 +
# 覆盖率采集 → coverage.json → 根 scripts/check_coverage_per_module.py 逐组
# 强制 ≥80%（backend 剖面：harness 子包包级分组；任一组缺口即退出 1）。
# coverage.json 用 $PIXI_PROJECT_ROOT 绝对路径落盘：src/conftest.py 在收集期
# chdir 至 scratch 目录（CWD 隔离防真实配置泄漏），相对路径会落到 scratch。
# 任务名契约——根 pixi coverage-gates / CI backend-test job 委托此处。
coverage-gates = { cmd = "pytest $PIXI_PROJECT_ROOT/src/tests/ $PIXI_PROJECT_ROOT/src/packages/harness/ --asyncio-mode=auto --cov=src --cov-report=json:$PIXI_PROJECT_ROOT/coverage.json -q && python ../scripts/check_coverage_per_module.py $PIXI_PROJECT_ROOT/coverage.json --enforce --profile backend", description = "全量测试 + 按模块覆盖率门禁（enforce 模式，阈值 80，显式 backend 剖面防 auto-detect 漂移）" }
# 中文注释门禁（任务名契约——根 pixi gates 链调用）：非测试源码 docstring
# 存在性 + 中文 + Google 段落报告（脚本扫描 backend/src + 根 scripts/）。
comment-gates = { cmd = "python ../scripts/check_chinese_comments.py", description = "中文注释门禁（docstring 存在性 + 中文；Google 段落缺口以 hints 报告）" }
# 同步测试棘轮（任务名契约——根 pixi gates 链调用）：def test_ 只降不升
# （基线 .sync_test_baseline.json 零起点——新增测试一律 async def test_）。
sync-test-ratchet = { cmd = "python ../scripts/count_sync_tests.py --enforce", description = "同步测试只降不升棘轮校验（对照 .sync_test_baseline.json，零容忍）" }
# noqa / type:ignore 增量冻结门（任务名契约——根 pixi gates 链调用）：
# backend 生产面基线零——严禁任何 noqa / type:ignore 抑制注释。
noqa-freeze = { cmd = "python ../scripts/noqa_freeze_check.py", description = "noqa / type:ignore 增量冻结门禁（backend 基线 0，只减不增）" }

# ═══════════════════════════════════════════════════════════════════════════════
# Feature: dev — 后端开发/测试工具（在 runtime 基础上叠加）
# 仅 default 环境包含此 feature；prod 不包含（Docker 生产不需要 pytest/ruff/mypy）。
# P0 决策：NO Redis——无 redis-server 系统依赖（缓存走进程内 TTL 实现）。
# ═══════════════════════════════════════════════════════════════════════════════
[feature.dev.pypi-dependencies]
# dev 工具由 pyproject.toml [project.optional-dependencies.dev] 声明，
# 通过 editable install extras=["dev"] 自动读取。
ai-agent-companion-backend = { path = ".", editable = true, extras = ["dev"] }

# ═══════════════════════════════════════════════════════════════════════════════
# Environments — 组合 features 用于不同场景
# ═══════════════════════════════════════════════════════════════════════════════
[environments]
# 本地开发：runtime + dev 工具（pytest/ruff/mypy）
default = ["dev"]
# Docker 后端容器：仅运行时依赖（不含 pytest/ruff/mypy，减小镜像体积）
prod = []
